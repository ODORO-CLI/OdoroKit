<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#3b82f6" />
    <title>Odoro</title>
    <script>
      // Applies the stored theme before the first paint. Doing it from React
      // would come too late: a visitor on a forced theme would see a flash of
      // the other one, for as long as the script takes to load.
      try {
        var theme = localStorage.getItem('odoro-theme')
        if (theme === 'light' || theme === 'dark')
          document.documentElement.dataset.theme = theme
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
