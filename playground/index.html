<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Documentation d'Odoro : systeme de style, animations, composants et routeur."
    />
    <title>Odoro — Documentation</title>
    <link rel="icon" type="image/svg+xml" href="/marque/mark.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/marque/apple-touch-icon.png" />
    <meta name="theme-color" content="#f97316" />
    <script>
      // Applique le theme memorise avant la premiere peinture : sans cela, un
      // utilisateur en theme force verrait un eclair de l'autre theme.
      try {
        var theme = localStorage.getItem('odoro-docs-theme')
        if (theme === 'light' || theme === 'dark')
          document.documentElement.dataset.theme = theme
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
