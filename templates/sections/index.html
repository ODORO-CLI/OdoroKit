<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GetLayers · Sections</title>
<!--
  Page d'entrée à la racine, pour GitHub Pages. L'index réel est dans sections/.
  La redirection est déclarative (meta refresh) pour fonctionner sans JavaScript,
  et le lien reste cliquable si elle est bloquée.
-->
<meta http-equiv="refresh" content="0; url=./sections/index.html">
<link rel="canonical" href="./sections/index.html">
<style>
  :root { --bg:#0d0e11; --ink:#f0f1f4; --muted:rgba(240,241,244,.6); --brand:#F57423; }
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);display:grid;place-items:center;
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    padding:24px;text-align:center}
  .mark{width:52px;height:52px;margin:0 auto 22px;display:block;color:var(--brand)}
  h1{margin:0 0 10px;font-size:22px;font-weight:650;letter-spacing:-.02em}
  p{margin:0 0 22px;color:var(--muted);max-width:42ch}
  a{display:inline-block;padding:11px 20px;border-radius:7px;text-decoration:none;
    background:var(--ink);color:var(--bg);font-weight:600;font-size:14px}
  a:hover{background:var(--brand);color:#fff}
</style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 100 100" role="img" aria-label="Odoro">
      <path d="M10 10 H50 A40 40 0 1 1 10 50 Z"
            fill="none" stroke="currentColor" stroke-width="14" stroke-linejoin="miter"/>
    </svg>
    <h1>Sections GetLayers</h1>
    <p>Redirection vers l'index. S'il ne s'ouvre pas tout seul, suivez le lien.</p>
    <a href="./sections/index.html">Ouvrir l'index</a>
  </main>
</body>
