<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Section · Ascent</title>
<!--
  GetLayers · Section — Ascent
  A scroll-PINNED growth story. The node/circle stays fixed at screen centre while the month
  timeline scrolls THROUGH it — each month lights up as it reaches the centre, ticks fade near the
  node, and a lime glow marks "now". On the right, a registered-users odometer rolls up and an
  animated title + subtitle swap per quarter, over a green pixel-cube field filling the right half.
  Pure HTML/CSS/JS + canvas — no external assets. Type: Inter (Google Fonts).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #050706; color: #eef2ee;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --green: #8fe24e; --green-2: #4c8f2e; }

  .scroll { height: 420vh; position: relative; }
  .pin { position: sticky; top: 0; height: 100vh; overflow: hidden;
    background:
      radial-gradient(70% 80% at 96% 0%, rgba(120,225,70,.20), transparent 52%),
      radial-gradient(60% 90% at 100% 50%, rgba(90,180,55,.10), transparent 60%),
      #050706;
    opacity: 0; transition: opacity .9s ease; }
  body.-ready .pin { opacity: 1; }

  /* green pixel-cube field — fills the right half, densest in the top-right corner */
  #pix { position: absolute; right: 0; top: 0; width: 56vw; height: 100vh; z-index: 0; pointer-events: none; }

  /* fixed spine + node at screen centre */
  .spine { position: absolute; top: 0; height: 100%; width: 1px; z-index: 1; pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(233,240,233,.16) 16%, rgba(233,240,233,.16) 84%, transparent); }

  #months { position: absolute; inset: 0; z-index: 2; pointer-events: none;
    -webkit-mask: linear-gradient(180deg, transparent 2%, #000 26%, #000 74%, transparent 98%);
            mask: linear-gradient(180deg, transparent 2%, #000 26%, #000 74%, transparent 98%); }
  .mlabel { position: absolute; text-align: right; white-space: nowrap;
    transform-origin: 100% 50%; will-change: transform, opacity;
    font-size: 14px; font-weight: 600; letter-spacing: .01em; color: #eef4ea; }
  .mtick { position: absolute; height: 1px; transform: translateY(-50%);
    background: rgba(233,240,233,.30); }

  .nglow { position: absolute; width: 320px; height: 320px; z-index: 2; transform: translate(-50%, -50%);
    border-radius: 50%; pointer-events: none; filter: blur(3px);
    background: radial-gradient(circle, rgba(143,226,78,.46) 0%, rgba(143,226,78,.12) 36%, transparent 66%); }

  .node { position: absolute; z-index: 3; transform: translate(-50%, -50%);
    width: var(--cd, 76px); height: var(--cd, 76px); border-radius: 50%; display: grid; place-items: center; pointer-events: none; }
  .node__ring { position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(var(--green) calc(var(--p, 0) * 360deg), rgba(255,255,255,.09) 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px)); }
  .node__face { position: absolute; inset: 5px; border-radius: 50%;
    background: radial-gradient(120% 120% at 50% 18%, #1a211b, #0a0e0b 82%);
    border: 1px solid rgba(233,240,233,.09); box-shadow: 0 14px 40px -10px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.06);
    display: grid; place-items: center; }
  .node__face svg { width: 42%; height: 42%; stroke: #e6efe1; stroke-width: 2.4; fill: none;
    stroke-linecap: round; stroke-linejoin: round; animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(1.5px) } 50% { transform: translateY(-2.5px) } }

  /* right-hand readout */
  /* desktop: quarter block above centre, metric below (split at the vertical middle) */
  .right { position: absolute; left: 52%; top: 50%; transform: translateY(calc(-100% - 14px)); z-index: 4;
    width: min(40vw, 460px); display: flex; flex-direction: column; }
  /* soft dark halo so text pops over the cube field */
  .right::before, .metric::before { content: ''; position: absolute; inset: -34px -60px -34px -30px; z-index: -1;
    background: radial-gradient(78% 88% at 32% 50%, rgba(5,7,6,.72), transparent 72%); pointer-events: none; }
  .chip { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: .06em;
    color: #d7f5c1; background: rgba(143,226,78,.08); border: 1px solid rgba(143,226,78,.28); }
  .chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
  .qtitle { margin: 20px 0 0; font-size: clamp(26px, 3.4vw, 42px); font-weight: 700; letter-spacing: -.02em; line-height: 1.05; color: #f6faf3; }
  .qsub { margin: 12px 0 0; max-width: 30ch; font-size: 15px; font-weight: 400; line-height: 1.5; color: rgba(233,240,233,.55); }

  .metric { position: absolute; left: 52%; top: 50%; transform: translateY(14px); z-index: 4; width: min(40vw, 460px); }
  .odo { display: flex; align-items: stretch; font-weight: 800; letter-spacing: -.02em; line-height: 1;
    font-size: clamp(46px, 7.4vw, 86px); color: #f6faf3; font-variant-numeric: tabular-nums;
    filter: drop-shadow(0 8px 26px rgba(0,0,0,.55)); }
  .od-d { position: relative; overflow: hidden; height: 1em; width: .62em;
    -webkit-mask: linear-gradient(180deg, transparent 0, #000 24%, #000 76%, transparent 100%);
            mask: linear-gradient(180deg, transparent 0, #000 24%, #000 76%, transparent 100%); }
  .od-strip { display: flex; flex-direction: column; will-change: transform; }
  .od-strip span { height: 1em; display: flex; align-items: center; justify-content: center; }
  .od-comma { width: .28em; display: flex; align-items: flex-end; justify-content: center; }
  .reg { margin-top: 8px; font-size: 14px; font-weight: 500; letter-spacing: .01em; color: rgba(233,240,233,.5); }

  /* per-quarter swap animation */
  @keyframes rise { from { opacity: 0; transform: translateY(12px); filter: blur(7px); } to { opacity: 1; transform: none; filter: blur(0); } }
  .anim { animation: rise .6s cubic-bezier(.22,.61,.36,1) both; }

  .hint { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 6;
    display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
    font-size: 10.5px; letter-spacing: .28em; text-transform: uppercase; color: rgba(233,240,233,.42);
    transition: opacity .5s ease; }
  body.-scrolled .hint { opacity: 0; }
  .hint .bar { width: 1px; height: 34px; background: linear-gradient(rgba(233,240,233,.5), transparent); }

  @media (prefers-reduced-motion: reduce) { .node__face svg { animation: none } .anim { animation: none } }

  /* tablet — tighten the split so the title + count fit the narrower right column */
  @media (min-width: 721px) and (max-width: 1024px) {
    .right, .metric { left: 46%; width: min(48vw, 400px); }
    #pix { width: 46vw; }
    .qtitle { font-size: clamp(24px, 3.6vw, 34px); }
  }

  /* mobile — stack it: quarter block on top, timeline in the middle, count at the bottom */
  @media (max-width: 720px) {
    #pix { width: 48vw; height: 26vh; }                  /* tight top-right corner, clear of the timeline */
    .mlabel { text-shadow: 0 1px 10px rgba(5,7,6,.85); } /* readable where labels meet the cubes */
    .right { left: 6vw; right: 6vw; top: 5.5vh; width: auto; transform: none; }
    .qtitle { font-size: 30px; margin-top: 13px; }
    .qsub { display: block; margin-top: 10px; font-size: 14px; max-width: 34ch; }
    .metric { left: 6vw; right: auto; top: auto; bottom: 6vh; width: auto; transform: none; }
    .odo { font-size: clamp(42px, 14.5vw, 66px); }
    .right::before, .metric::before { display: none; }   /* no halo needed — cubes are a top-right accent here */
    .nglow { width: 220px; height: 220px; }              /* fits the narrow screen */
    .hint { display: none; }
  }
</style>
<!-- ODORO-BADGE:START -->
<style>
  /* Badge de marque ODORO. Bloc autonome, retirable d'un bloc sans rien casser. */
  .odoro-badge {
    position: fixed;
    top: var(--odoro-top, clamp(14px, 2.2vw, 26px));
    left: clamp(14px, 2.2vw, 26px);
    z-index: 2147483000;
    display: flex; align-items: center; gap: .24em;
    color: #F57423;
    font: 600 clamp(15px, 1.45vw, 19px)/1 Poppins, "Nunito Sans", "Avenir Next",
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    letter-spacing: -.012em;
    /* Ne jamais intercepter le pointeur : plusieurs Sections se pilotent au drag. */
    pointer-events: none;
    user-select: none; -webkit-user-select: none;
  }
  .odoro-badge svg { width: 1.45em; height: 1.45em; display: block; flex: none; }
  .odoro-badge span { padding-bottom: .05em; }
  @media (prefers-reduced-motion: reduce) { .odoro-badge { transition: none; } }
</style>
<!-- ODORO-BADGE:END -->
</head>
<body>
<div class="scroll">
  <div class="pin" id="pin">
    <canvas id="pix"></canvas>
    <div class="spine" id="spine"></div>
    <div id="months"></div>
    <div class="nglow" id="nglow"></div>
    <div class="node" id="node">
      <div class="node__ring" id="ring"></div>
      <div class="node__face"><svg viewBox="0 0 24 24"><path d="M6 13l6-6 6 6M6 18l6-6 6 6"/></svg></div>
    </div>

    <div class="right">
      <div class="chip" id="chip">Q1 · 2024</div>
      <h2 class="qtitle" id="qtitle">Early traction</h2>
      <p class="qsub" id="qsub">A first cohort finds the product — and quietly stays.</p>
    </div>
    <div class="metric">
      <div class="odo" id="odo"></div>
      <div class="reg">Registered users</div>
    </div>
  </div>
</div>
<div class="hint"><span>Scroll</span><span class="bar"></span></div>

<script>
const CONFIG = {
  months: ['Jan 2024','Feb 2024','Mar 2024','Apr 2024','May 2024','Jun 2024','Jul 2024','Aug 2024','Sep 2024'],
  counts: [ 12400, 16800, 23500, 31200, 40800, 52000, 63500, 71800, 78000 ], // cumulative registered users
  quarters: [
    { label: 'Q1 · 2024', title: 'Early traction',  sub: 'A first cohort finds the product — and quietly stays.' },
    { label: 'Q2 · 2024', title: 'Word gets out',   sub: 'Referrals compound as teams start inviting their teams.' },
    { label: 'Q3 · 2024', title: 'Breakout quarter', sub: 'Launch week tips the curve into a whole new gear.' },
  ],
  ease: 0.085,
}

const pin = document.getElementById('pin')
const spine = document.getElementById('spine')
const monthsEl = document.getElementById('months')
const node = document.getElementById('node')
const ring = document.getElementById('ring')
const nglow = document.getElementById('nglow')
const odo = document.getElementById('odo')
const chip = document.getElementById('chip'), qtitle = document.getElementById('qtitle'), qsub = document.getElementById('qsub')

/* ---------- month rows (label + tick) ---------- */
const rows = CONFIG.months.map(m => {
  const label = document.createElement('div'); label.className = 'mlabel'; label.textContent = m
  const tick = document.createElement('div'); tick.className = 'mtick'
  monthsEl.appendChild(label); monthsEl.appendChild(tick)
  return { label, tick }
})

/* ---------- split-flap odometer (places 1000,100,10,1 + comma) ---------- */
const PLACES = [10000, 1000, 100, 10, 1]
const strips = []
PLACES.forEach((place, i) => {
  const d = document.createElement('span'); d.className = 'od-d'
  const strip = document.createElement('span'); strip.className = 'od-strip'
  for (let n = 0; n <= 10; n++) { const t = document.createElement('span'); t.textContent = n % 10; strip.appendChild(t) }
  d.appendChild(strip); odo.appendChild(d); strips.push(strip)
  if (i === 1) { const c = document.createElement('span'); c.className = 'od-comma'; c.textContent = ','; odo.appendChild(c) }   // 78,000
})
function setOdo(disp) {
  PLACES.forEach((place, i) => {
    const v = disp / place, dg = Math.floor(v) % 10, frac = v - Math.floor(v)
    const roll = frac > 0.8 ? (frac - 0.8) / 0.2 : 0
    const h = strips[i].firstChild.offsetHeight
    strips[i].style.transform = `translateY(${-(dg + roll) * h}px)`
  })
}

/* ---------- geometry ---------- */
let W = 0, H = 0, spineX = 0, cy = 0, cd = 76, spacing = 96
function layout() {
  W = innerWidth; H = innerHeight
  const mobile = W <= 720
  if (mobile) {
    spineX = Math.round(W * 0.82)                     // progress aligned right; labels to its left
    cy = Math.round(H * 0.5)                          // node centred; text sits at top/bottom
    cd = Math.max(52, Math.min(H * 0.085, 66))
    spacing = Math.max(58, Math.min(H * 0.10, 92))
  } else {
    spineX = Math.round(W * 0.30)                     // spine a bit more to the left
    cy = Math.round(H * 0.5)                          // node always at screen centre
    cd = Math.max(60, Math.min(H * 0.13, 84))
    spacing = Math.max(72, Math.min(H * 0.135, 112))
  }
  spine.style.left = spineX + 'px'
  node.style.left = spineX + 'px'; node.style.top = cy + 'px'; node.style.setProperty('--cd', cd + 'px')
  nglow.style.left = spineX + 'px'; nglow.style.top = cy + 'px'
  const labelRight = spineX - cd / 2 - 20             // labels clear the circle
  rows.forEach(r => {
    r.label.style.left = '0'; r.label.style.width = labelRight + 'px'
    r.tick.style.left = (spineX - 7) + 'px'; r.tick.style.width = '14px'
  })
}

/* ---------- render for a progress value ---------- */
const lerp = (a, b, t) => a + (b - a) * t
function countAt(cf) {
  const i0 = Math.floor(cf), i1 = Math.min(CONFIG.counts.length - 1, i0 + 1), t = cf - i0
  return lerp(CONFIG.counts[i0], CONFIG.counts[i1], t)
}
let curQ = -1
function swapQuarter(q) {
  ;[[chip, q.label], [qtitle, q.title], [qsub, q.sub]].forEach(([el, txt]) => {
    el.textContent = txt; el.classList.remove('anim'); void el.offsetWidth; el.classList.add('anim')
  })
}
function render(p) {
  const N = CONFIG.months.length
  const cf = p * (N - 1)                 // current (float) month index at the centre
  const active = Math.round(cf)
  rows.forEach((r, i) => {
    const d = i - cf, ad = Math.abs(d)
    const y = cy + d * spacing
    r.label.style.top = y + 'px'; r.tick.style.top = y + 'px'
    const prox = Math.max(0, 1 - ad)     // 1 at centre → 0 by one row out (smooth, tracks scroll)
    r.label.style.transform = `translateY(-50%) translateX(${(-18 * prox).toFixed(1)}px) scale(${(1 + 0.09 * prox).toFixed(3)})`
    r.label.style.opacity = Math.max(0.14, 1 - ad * 0.32).toFixed(3)
    r.tick.style.opacity = Math.max(0, Math.min(1, (ad - 0.55) / 0.8)).toFixed(3)   // dashes vanish near the node
  })
  ring.style.setProperty('--p', p.toFixed(4))
  setOdo(countAt(cf))
  const qi = Math.min(CONFIG.quarters.length - 1, Math.floor(active / 3))
  if (qi !== curQ) { curQ = qi; swapQuarter(CONFIG.quarters[qi]) }
}

/* ---------- scroll → eased progress ---------- */
const wrap = document.querySelector('.scroll')
let target = 0, cur = 0
function readScroll() {
  const rect = wrap.getBoundingClientRect()
  const total = wrap.offsetHeight - innerHeight
  target = Math.max(0, Math.min(1, -rect.top / total))
  if (target > 0.003) document.body.classList.add('-scrolled')
}
addEventListener('scroll', readScroll, { passive: true })
addEventListener('resize', () => { layout(); buildPix(); readScroll() })

/* ---------- green pixel-cubes (canvas, right half) ---------- */
const pix = document.getElementById('pix'); const pctx = pix.getContext('2d')
let cells = []
function buildPix() {
  const r = pix.getBoundingClientRect(); const dpr = Math.min(devicePixelRatio, 2)
  pix.width = r.width * dpr; pix.height = r.height * dpr; pctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  const gap = Math.max(11, r.width / 40); cells = []          // small cubes; more of them
  let seed = 8.31; const rnd = () => (seed = Math.sin(seed * 91.7 + 3) * 43758.5, seed - Math.floor(seed))
  for (let x = 0; x < r.width; x += gap) for (let y = 0; y < r.height; y += gap) {
    const nx = x / r.width, ny = y / r.height
    const d = Math.hypot(1 - nx, ny)                          // 0 at the top-right corner
    if (rnd() < 1.05 - d * 0.92) cells.push({ x, y, s: gap * (0.4 + rnd() * 0.42), d, ph: rnd() * 6.28 })
  }
}
function drawPix(t, p) {
  const r = pix.getBoundingClientRect(); pctx.clearRect(0, 0, r.width, r.height)
  const intensity = 0.3 + 0.7 * p
  for (const c of cells) {
    const fall = Math.max(0, 1 - c.d * 0.82)
    const tw = 0.5 + 0.5 * Math.sin(t * 0.0015 + c.ph + c.d * 4)
    const a = fall * tw * intensity
    if (a <= 0.02) continue
    pctx.fillStyle = `rgba(150,232,86,${a.toFixed(3)})`
    pctx.fillRect(c.x, c.y, c.s, c.s)
  }
}

/* ---------- boot ---------- */
function boot() {
  layout(); buildPix(); readScroll()
  requestAnimationFrame(function loop(t) {
    cur += (target - cur) * CONFIG.ease
    if (Math.abs(target - cur) < 1e-4) cur = target
    render(cur); drawPix(t, cur)
    nglow.style.opacity = (0.7 + 0.3 * Math.sin(t * 0.0018)).toFixed(3)   // gentle idle pulse
    requestAnimationFrame(loop)
  })
  requestAnimationFrame(() => document.body.classList.add('-ready'))
}
document.fonts && document.fonts.ready ? document.fonts.ready.then(boot) : boot()
addEventListener('load', () => { layout(); buildPix(); readScroll() })
</script>
<!-- ODORO-BADGE:START -->
<div class="odoro-badge" role="img" aria-label="Odoro">
  <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
    <path d="M10 10 H50 A40 40 0 1 1 10 50 Z"
          fill="none" stroke="currentColor" stroke-width="14" stroke-linejoin="miter"/>
  </svg>
  <span>odoro</span>
</div>
<!-- ODORO-BADGE:END -->
</body>
</html>
