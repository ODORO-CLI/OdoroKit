<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" role="img" aria-label="Odoro">
  <title>Odoro</title>
  <!--
    Le lockup : la marque suivie du mot. Le mot est du texte vivant, pas des tracés, donc son
    rendu dépend de la police disponible sur la machine. La pile ci-dessous vise un grotesque
    géométrique à contreformes rondes ; sans Poppins ni Nunito installées, le repli reste proche
    mais n'est pas identique au fichier de marque d'origine.
    Pour un rendu garanti, remplacer ce <text> par les tracés vectorisés du logo officiel.
  -->
  <path d="M10 10 H50 A40 40 0 1 1 10 50 Z"
        fill="none" stroke="#F57423" stroke-width="14" stroke-linejoin="miter"/>
  <text x="112" y="51" dominant-baseline="central"
        font-family="Poppins, 'Nunito Sans', 'Avenir Next', 'Segoe UI', system-ui, sans-serif"
        font-size="68" font-weight="600" letter-spacing="-1" fill="#F57423">odoro</text>
</svg>
