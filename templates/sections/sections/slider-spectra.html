<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Section · Spectra</title>
<!--
  GetLayers · Section — Spectra
  A self-contained immersive EYEWEAR slider: a dark stage where portrait cards fan into a
  coverflow arc under a faint glasses silhouette. The centre card lifts, brightens and casts a
  coloured halo keyed to its own hue; the neighbours tilt, sink and dim into the dark. It autoplays
  (pausing on hover, while dragging, and when the tab is hidden); drag / swipe / arrow-keys /
  click-a-card also spin the fan (continuous, momentum-eased, wraps forever). Below: a glasses mark,
  a light-weight headline and an "Enter Store" pill.

  Pure HTML + CSS 3D + one small script — no WebGL, no framework, no external deps. Card photos load
  from assets/spectra/*.webp (a c1/c2 gradient stays as the fallback behind each image). A dev
  controls panel (top-right) live-tunes every value; strip the marked #ui block for the catalog.
-->
<style>
  /* ---- reset (the file is standalone so it owns the page) ---- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg, #05070c); }

  /* ---- CONFIG → CSS custom properties (mirror the JS CONFIG below) ---- */
  #section {
    --bg:       #05070c;   /* stage background (near-black) */
    --bg2:      #0a1020;   /* subtle upper wash */
    --text:     #f4f6fb;   /* headline / button ink */
    --muted:    rgba(244,246,251,.42);
    --halo:     #ff2e74;   /* live glow colour — JS keeps it in sync with the centre card */
    --card-w:   260px;     /* card size — JS scales these with the viewport */
    --card-h:   330px;
    --ease:     cubic-bezier(.22,.61,.36,1);
  }

  /* ---- the section fills the viewport (one "screen section") ---- */
  #section {
    position: relative; overflow: hidden;
    min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(18px, 3.5vh, 46px);
    padding: clamp(28px, 6vh, 72px) 16px;
    background:
      radial-gradient(140% 100% at 50% -8%, var(--bg2) 0%, transparent 55%),
      radial-gradient(120% 90% at 50% 120%, #000 10%, transparent 60%),
      var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* coloured halo that bleeds from behind the centre card (hue tracks the active card) */
  .halo {
    position: absolute; top: 46%; left: 50%; z-index: 0;
    width: min(70vw, 640px); aspect-ratio: 1; transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, var(--halo), transparent 72%);
    opacity: .32; filter: blur(30px); pointer-events: none;
    transition: background .5s var(--ease);
  }

  /* small glasses mark above the fan */
  .mark { position: relative; z-index: 2; color: var(--text); display: grid; place-items: center; }
  .mark svg { width: 46px; height: auto; display: block; }

  /* ---- the coverflow stage ---- */
  .stage {
    position: relative; z-index: 1;
    width: 100%; height: calc(var(--card-h) + 90px);
    display: grid; place-items: center;
    perspective: var(--persp, 1600px); perspective-origin: 50% 44%;
    cursor: grab; touch-action: pan-y; user-select: none;
  }
  .stage.-drag { cursor: grabbing; }

  .deck { position: relative; width: 0; height: 0; transform-style: preserve-3d; }

  .card {
    position: absolute; width: var(--card-w); height: var(--card-h);
    left: calc(var(--card-w) / -2); top: calc(var(--card-h) / -2);
    margin: 0; padding: 0; border: 0; background: none; cursor: pointer;
    transform-style: preserve-3d; will-change: transform, opacity;
    -webkit-tap-highlight-color: transparent;
  }
  .card__inner {
    position: absolute; inset: 0; border-radius: 22px; overflow: hidden;
    background: #0a0e18;
    box-shadow: 0 30px 60px -22px rgba(0,0,0,.85), 0 6px 20px -10px rgba(0,0,0,.7);
  }
  /* neon-gradient portrait placeholder (an <img>, if given, sits on top) */
  .card__media {
    position: absolute; inset: 0;
    background:
      radial-gradient(115% 78% at 50% 122%, rgba(0,0,0,.82), transparent 52%),
      radial-gradient(58% 66% at 61% 54%, rgba(0,0,0,.55), transparent 60%),
      radial-gradient(92% 62% at 46% 6%,  color-mix(in srgb, var(--c1) 78%, #fff 22%), transparent 66%),
      linear-gradient(158deg, var(--c1), var(--c2));
  }
  .card__media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  /* glossy edge + inner ring */
  .card__inner::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .card:focus-visible { outline: none; }
  .card:focus-visible .card__inner { box-shadow: 0 30px 60px -22px rgba(0,0,0,.85), 0 0 0 3px var(--halo); }

  /* ---- headline + call to action ---- */
  .caption {
    position: relative; z-index: 2; margin: 0; text-align: center;
    font-weight: 300; letter-spacing: -.005em; line-height: 1.05;
    font-size: clamp(28px, 5.4vw, 54px);
  }
  .cta {
    position: relative; z-index: 2;
    display: inline-flex; align-items: center; gap: 14px;
    padding: 9px 9px 9px 26px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--text); color: #08090d; text-decoration: none;
    font-size: 15px; font-weight: 600; letter-spacing: .01em;
    transition: transform .2s var(--ease), box-shadow .2s var(--ease);
    box-shadow: 0 12px 30px -12px rgba(0,0,0,.7);
  }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 18px 40px -14px rgba(0,0,0,.8); }
  .cta:active { transform: translateY(0); }
  .cta:focus-visible { outline: 2px solid var(--halo); outline-offset: 4px; }
  .cta__dot { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 999px;
    background: #08090d; color: #fff; }
  .cta__dot svg { width: 15px; height: 15px; }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  @media (prefers-reduced-motion: reduce) {
    .halo { transition: none; }
  }

  /* ============ DEV CONTROLS — remove this block (+ the panel markup & JS) to ship without the panel ============ */
  #ui { position: fixed; top: 12px; right: 12px; z-index: 10; width: 236px; max-height: 92vh; overflow: auto;
    background: rgba(9,11,18,.86); border: 1px solid rgba(255,255,255,.12); border-radius: 8px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #e7e7ef; font: 11px/1.35 -apple-system, system-ui, sans-serif; user-select: none; }
  #ui-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; cursor: pointer; }
  #ui-head b { font-weight: 600; letter-spacing: .04em; }
  #ui-head span { color: rgba(231,231,239,.5); font-size: 14px; }
  #ui-body { padding: 2px 10px 10px; display: block; }
  #ui.-collapsed #ui-body { display: none; }
  .ui-grp { margin: 8px 0 2px; color: rgba(190,200,255,.72); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; }
  .ui-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 5px 0; }
  .ui-row label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: rgba(231,231,239,.82); }
  .ui-row input[type=range] { width: 104px; }
  .ui-row input[type=color] { width: 26px; height: 18px; padding: 0; border: 1px solid rgba(255,255,255,.2); border-radius: 3px; background: none; cursor: pointer; }
  .ui-row .val { width: 46px; text-align: right; font: 10px/1 ui-monospace, Menlo, monospace; color: rgba(190,200,255,.9); }
  #ui-copy, #ui-reset { width: 100%; padding: 6px; cursor: pointer; color: #e7e7ef;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16); border-radius: 5px; font: 11px/1 inherit; }
  #ui-copy { margin-top: 10px; border-color: rgba(140,170,255,.4); color: #d9e4ff; }
  #ui-reset { margin-top: 6px; }
  #ui-copy:hover, #ui-reset:hover { background: rgba(255,255,255,.13); }
  /* ============ END DEV CONTROLS ============ */
</style>
<!-- ODORO-BADGE:START -->
<style>
  /* Badge de marque ODORO. Bloc autonome, retirable d'un bloc sans rien casser. */
  .odoro-badge {
    position: fixed;
    top: var(--odoro-top, clamp(14px, 2.2vw, 26px));
    left: clamp(14px, 2.2vw, 26px);
    z-index: 2147483000;
    display: flex; align-items: center; gap: .24em;
    color: #F57423;
    font: 600 clamp(15px, 1.45vw, 19px)/1 Poppins, "Nunito Sans", "Avenir Next",
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    letter-spacing: -.012em;
    /* Ne jamais intercepter le pointeur : plusieurs Sections se pilotent au drag. */
    pointer-events: none;
    user-select: none; -webkit-user-select: none;
  }
  .odoro-badge svg { width: 1.45em; height: 1.45em; display: block; flex: none; }
  .odoro-badge span { padding-bottom: .05em; }
  @media (prefers-reduced-motion: reduce) { .odoro-badge { transition: none; } }
</style>
<!-- ODORO-BADGE:END -->
</head>
<body>

<!-- ===== 4. MARKUP — the section ===== -->
<section id="section" aria-roledescription="carousel" aria-label="Eyewear showcase">
  <div class="halo" aria-hidden="true"></div>

  <div class="mark" aria-hidden="true">
    <!-- minimalist glasses logo -->
    <svg viewBox="0 0 120 46" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round">
      <path d="M6 16 Q2 18 2 26"/>
      <path d="M114 16 Q118 18 118 26"/>
      <circle cx="34" cy="26" r="16"/>
      <circle cx="86" cy="26" r="16"/>
      <path d="M50 24 q10 -8 20 0"/>
    </svg>
  </div>

  <div class="stage" id="stage" role="group" aria-label="Drag, swipe or use arrow keys to browse eyewear">
    <div class="deck" id="deck"><!-- cards injected from CONFIG.cards --></div>
  </div>

  <h2 class="caption" id="caption">Eyewear That Stands Out</h2>

  <a class="cta" id="cta" href="#">
    <span id="ctaLabel">Enter Store</span>
    <span class="cta__dot" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
    </span>
  </a>

  <p class="sr-only" aria-live="polite" id="live"></p>
</section>

<!-- ===== DEV CONTROLS — remove this block (+ the #ui CSS + the panel JS) to ship without the panel ===== -->
<div id="ui">
  <div id="ui-head"><b>Spectra</b><span id="ui-caret">▾</span></div>
  <div id="ui-body"></div>
</div>
<!-- ===== END DEV CONTROLS ===== -->

<script type="module">
/* ============================================================
   3. CONFIG — every tunable value. Colors are '#rrggbb'; the rest
   numbers/strings. The single place to art-direct the section.
   (The CSS custom properties above mirror the palette keys.)
============================================================ */
const CONFIG = {
  heading: 'Eyewear That Stands Out',
  cta:     { label: 'Enter Store', href: '#' },

  /* palette (mirrored into the CSS custom properties) */
  /* Spectra — tuned values; paste over the matching keys in CONFIG */
// palette
bg: '#05070c',
bg2: '#0a1020',
text: '#f4f6fb',
// fan geometry
cardW: 260,
cardH: 330,
gap: 164,
rotate: 38,
depth: 150,
drop: 24,
shrink: 0.14,
fade: 0.26,
dim: 0.2,
visible: 3,
persp: 1680,
// motion
autoplayMs: 3200,
ease: 0.14,
sensitivity: 0.0072,
start: 2,
  /* the cards — real photos in assets/spectra/; the c1/c2 gradient is the fallback
     behind each image, and `glow` sets the halo hue when the card is centred. */
  cards: [
    { name: 'Driftwood', img: 'assets/spectra/driftwood-blue.webp', c1: '#3f6bab', c2: '#10131f', glow: '#4a86d8' },
    { name: 'Dew',       img: 'assets/spectra/dew-grass.webp',      c1: '#4ea23a', c2: '#0d2a12', glow: '#5fce46' },
    { name: 'Rain',      img: 'assets/spectra/rain-round.webp',     c1: '#6f86a8', c2: '#141a24', glow: '#8aa6cf' },
    { name: 'Sepia',     img: 'assets/spectra/reading-room.webp',   c1: '#c6924e', c2: '#2c1d10', glow: '#e0ab63' },
    { name: 'Carbon',    img: 'assets/spectra/carbon-silver.webp',  c1: '#c8a988', c2: '#14110d', glow: '#e2c39a' },
    { name: 'Lens',      img: 'assets/spectra/lens-macro.webp',     c1: '#5a7ba8', c2: '#0b0f16', glow: '#6f93c4' },
    { name: 'Clear',     img: 'assets/spectra/desk-clear.webp',     c1: '#7fae8f', c2: '#141a17', glow: '#9fd0ad' },
  ],
}

/* ---------- apply CONFIG ---------- */
const section = document.getElementById('section')
const stage   = document.getElementById('stage')
const deck    = document.getElementById('deck')
const halo    = section.querySelector('.halo')
const live    = document.getElementById('live')

document.getElementById('caption').textContent = CONFIG.heading
document.getElementById('ctaLabel').textContent = CONFIG.cta.label
document.getElementById('cta').setAttribute('href', CONFIG.cta.href)

const N = CONFIG.cards.length
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches

/* ---- dev-panel plumbing: the tunable subset of CONFIG, persisted to localStorage ---- */
const TUNABLES = ['bg','bg2','text','cardW','cardH','gap','rotate','depth','drop','shrink','fade','dim','visible','persp','autoplayMs','ease','sensitivity','start']
const DEFAULTS = {}; for (const k of TUNABLES) DEFAULTS[k] = CONFIG[k]   // snapshot BEFORE restoring
const STORAGE_KEY = 'getlayers:spectra'
try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); if (s) for (const k of TUNABLES) if (k in s) CONFIG[k] = s[k] } catch (e) {}
const saveP = () => { try { const o = {}; for (const k of TUNABLES) o[k] = CONFIG[k]; localStorage.setItem(STORAGE_KEY, JSON.stringify(o)) } catch (e) {} }

/* push the palette into the CSS custom properties (so the panel can recolour live) */
function applyStyles() {
  const s = section.style
  s.setProperty('--bg', CONFIG.bg)
  s.setProperty('--bg2', CONFIG.bg2)
  s.setProperty('--text', CONFIG.text)
}

/* build the deck */
const cards = CONFIG.cards.map((cd, i) => {
  const el = document.createElement('button')
  el.type = 'button'
  el.className = 'card'
  el.setAttribute('aria-label', `${cd.name} — eyewear ${i + 1} of ${N}`)
  el.style.setProperty('--c1', cd.c1)
  el.style.setProperty('--c2', cd.c2)
  el.innerHTML = `<span class="card__inner"><span class="card__media">${
    cd.img ? `<img src="${cd.img}" alt="${cd.name} eyewear" draggable="false" loading="lazy">` : ''
  }</span></span>`
  el.addEventListener('click', () => { if (!moved) go(i) })
  deck.appendChild(el)
  return el
})

/* ---------- responsive sizing ---------- */
function layout() {
  const vw = innerWidth
  const f  = Math.max(0.56, Math.min(1, vw / 1180))   // scale factor
  section.style.setProperty('--card-w', Math.round(CONFIG.cardW * f) + 'px')
  section.style.setProperty('--card-h', Math.round(CONFIG.cardH * f) + 'px')
  section.style.setProperty('--persp', Math.max(1050, CONFIG.persp * f) + 'px')
  scale = f
}
let scale = 1
window.addEventListener('resize', () => { layout(); frame() })
layout()

/* ---------- coverflow state ---------- */
let pos    = CONFIG.start   // continuous index (fractional while dragging / gliding)
let target = CONFIG.start   // whole index we ease toward

/* shortest signed offset of card i from the current position, wrapped around the ring */
const wrap = o => { o = ((o % N) + N) % N; return o > N / 2 ? o - N : o }

function paint() {
  const { gap, rotate, depth, drop, shrink, fade, dim, visible } = CONFIG
  for (let i = 0; i < N; i++) {
    const o  = wrap(i - pos)
    const ao = Math.abs(o)
    const el = cards[i]
    if (ao > visible + 0.5) { el.style.opacity = '0'; el.style.pointerEvents = 'none'; continue }
    const sc = Math.max(0.4, 1 - ao * shrink)
    el.style.transform =
      `translateX(${o * gap * scale}px) translateY(${ao * drop * scale}px) ` +
      `translateZ(${-ao * depth * scale}px) rotateY(${-o * rotate}deg) scale(${sc})`
    el.style.opacity = String(Math.max(0, 1 - ao * fade))
    el.style.filter  = `brightness(${Math.max(0.3, 1 - ao * dim)}) saturate(${1 + (1 - Math.min(1, ao)) * 0.25})`
    el.style.zIndex  = String(Math.round(100 - ao * 10))
    el.style.pointerEvents = 'auto'
  }
  const active = ((Math.round(pos) % N) + N) % N
  halo.style.setProperty('--halo', CONFIG.cards[active].glow)
  section.style.setProperty('--halo', CONFIG.cards[active].glow)
}

/* animation loop — glide `pos` toward `target` (unless dragging or reduced-motion snaps) */
let raf = null, lastActive = -1
function frame() {
  if (!dragging) {
    if (reduce) pos = target
    else {
      pos += (target - pos) * CONFIG.ease
      if (Math.abs(target - pos) < 0.001) pos = target
    }
  }
  paint()
  const active = ((Math.round(pos) % N) + N) % N
  if (active !== lastActive) { lastActive = active; announce(active) }
  raf = requestAnimationFrame(frame)
}
function announce(i) { live.textContent = `${CONFIG.cards[i].name}, ${i + 1} of ${N}` }

/* move to an index by the shortest direction (keeps the ring seamless) */
function go(i) {
  const cur = Math.round(target)
  target = cur + wrap(i - cur)
}
const next = () => { target += 1 }
const prev = () => { target -= 1 }

/* ---------- drag / swipe ---------- */
let dragging = false, moved = false, lastX = 0, startX = 0, vel = 0

stage.addEventListener('pointerdown', e => {
  dragging = true; moved = false; lastX = startX = e.clientX; vel = 0
  stage.classList.add('-drag'); stage.setPointerCapture(e.pointerId)
})
stage.addEventListener('pointermove', e => {
  if (!dragging) return
  const dx = e.clientX - lastX; lastX = e.clientX
  if (Math.abs(e.clientX - startX) > 5) moved = true
  const d = -dx * CONFIG.sensitivity
  pos += d; vel = d
  paint()
})
function release() {
  if (!dragging) return
  dragging = false; stage.classList.remove('-drag')
  /* project momentum, then snap to the nearest card */
  target = Math.round(pos + vel * 8)
  vel = 0
}
stage.addEventListener('pointerup', release)
stage.addEventListener('pointercancel', release)

/* ---------- keyboard ---------- */
section.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { next(); e.preventDefault() }
  else if (e.key === 'ArrowLeft') { prev(); e.preventDefault() }
  else if (e.key === 'Home') { go(0); e.preventDefault() }
  else if (e.key === 'End') { go(N - 1); e.preventDefault() }
})

/* ---------- autoplay (pauses on hover, while dragging, and when the tab is hidden) ---------- */
let hovering = false
let autoTimer = null
const autoActive = () => CONFIG.autoplayMs > 0 && !reduce && !hovering && !dragging && !document.hidden
function syncAutoplay() {
  clearInterval(autoTimer); autoTimer = null
  if (autoActive()) autoTimer = setInterval(next, CONFIG.autoplayMs)
}
stage.addEventListener('mouseenter', () => { hovering = true; syncAutoplay() })
stage.addEventListener('mouseleave', () => { hovering = false; syncAutoplay() })
document.addEventListener('visibilitychange', syncAutoplay)
/* keep drag start/end in sync with autoplay */
stage.addEventListener('pointerdown', syncAutoplay)
stage.addEventListener('pointerup', syncAutoplay)
stage.addEventListener('pointercancel', syncAutoplay)

/* ============================================================
   DEV CONTROLS — schema-driven panel that live-tunes CONFIG,
   persists to localStorage, and copies the values back as source.
   (Strip this block + the #ui markup/CSS for the catalog build.)
============================================================ */
const SCHEMA = [
  ['Palette'],
  ['bg', 'Background', 'color'], ['bg2', 'Top wash', 'color'], ['text', 'Ink', 'color'],
  ['Fan geometry'],
  ['cardW', 'Card width', 140, 340, 2], ['cardH', 'Card height', 160, 440, 2],
  ['gap', 'Spacing', 40, 240, 2], ['rotate', 'Tilt', 0, 70, 1], ['depth', 'Depth', 0, 320, 5],
  ['drop', 'Edge drop', 0, 90, 2], ['shrink', 'Shrink', 0, 0.3, 0.005], ['fade', 'Fade', 0, 0.6, 0.01],
  ['dim', 'Dim', 0, 0.6, 0.01], ['visible', 'Visible /side', 1, 5, 1], ['persp', 'Perspective', 800, 2600, 20],
  ['Motion'],
  ['autoplayMs', 'Autoplay ms', 0, 8000, 100], ['ease', 'Glide', 0.04, 0.4, 0.01],
  ['sensitivity', 'Drag speed', 0.002, 0.02, 0.0005], ['start', 'Start card', 0, N - 1, 1],
]
const valEls = {}, inpEls = {}
const fmt = v => Number.isInteger(v) ? String(v) : String(parseFloat(v.toFixed(4)))
function onChange(key, v) {
  CONFIG[key] = v; saveP()
  if (key === 'autoplayMs') syncAutoplay()
  if (key === 'start') go(CONFIG.start)
  layout(); applyStyles(); paint()
}

function buildPanel() {
  const body = document.getElementById('ui-body')
  for (const row of SCHEMA) {
    if (row.length === 1) { const h = document.createElement('div'); h.className = 'ui-grp'; h.textContent = row[0]; body.appendChild(h); continue }
    const [key, label, a, b, step] = row
    const el = document.createElement('div'); el.className = 'ui-row'
    const lab = document.createElement('label'); lab.textContent = label; el.appendChild(lab)
    if (a === 'color') {
      const inp = document.createElement('input'); inp.type = 'color'; inp.value = CONFIG[key]; inpEls[key] = inp
      inp.addEventListener('input', () => onChange(key, inp.value)); el.appendChild(inp)
    } else {
      const inp = document.createElement('input'); inp.type = 'range'; inp.min = a; inp.max = b; inp.step = step; inp.value = CONFIG[key]; inpEls[key] = inp
      const val = document.createElement('span'); val.className = 'val'; val.textContent = fmt(CONFIG[key]); valEls[key] = val
      inp.addEventListener('input', () => { onChange(key, parseFloat(inp.value)); val.textContent = fmt(CONFIG[key]) })
      el.appendChild(inp); el.appendChild(val)
    }
    body.appendChild(el)
  }
  const copy = document.createElement('button'); copy.id = 'ui-copy'; copy.textContent = '⧉ copy config'
  copy.addEventListener('click', () => copyConfig(copy)); body.appendChild(copy)
  const reset = document.createElement('button'); reset.id = 'ui-reset'; reset.textContent = '↺ reset to defaults'
  reset.addEventListener('click', () => { for (const k of TUNABLES) CONFIG[k] = DEFAULTS[k]; try { localStorage.removeItem(STORAGE_KEY) } catch (e) {} location.reload() })
  body.appendChild(reset)
  const head = document.getElementById('ui-head'), panel = document.getElementById('ui'), caret = document.getElementById('ui-caret')
  head.addEventListener('click', () => { panel.classList.toggle('-collapsed'); caret.textContent = panel.classList.contains('-collapsed') ? '▸' : '▾' })
  if (innerWidth < 760) { panel.classList.add('-collapsed'); caret.textContent = '▸' }
}

const GROUPS = { bg: 'palette', cardW: 'fan geometry', autoplayMs: 'motion' }
function configText() {
  const lines = ['/* Spectra — tuned values; paste over the matching keys in CONFIG */']
  for (const k of TUNABLES) {
    if (GROUPS[k]) lines.push('// ' + GROUPS[k])
    const v = CONFIG[k]
    lines.push(`${k}: ${typeof v === 'string' ? `'${v}'` : fmt(v)},`)
  }
  return lines.join('\n')
}
async function copyConfig(btn) {
  const text = configText()
  try { await navigator.clipboard.writeText(text) }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy') } catch (e2) {} document.body.removeChild(ta) }
  const old = btn.textContent; btn.textContent = '✓ copied'; setTimeout(() => { btn.textContent = old }, 1200)
}

/* ---------- go ---------- */
applyStyles(); buildPanel()
go(CONFIG.start); pos = CONFIG.start; frame(); syncAutoplay()
</script>
