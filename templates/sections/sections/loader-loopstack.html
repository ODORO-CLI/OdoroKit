<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Section · Loopstack Loader</title>
<!--
  GetLayers · Section — Loopstack Loader (role: loader)

  WHAT THIS IS
  A masked, blurred, left-to-right letter sweep of a wordmark pinned to the bottom edge of a
  fixed frame. The last glyph lands at exactly 1.92s; that landing is the gate, and the content
  block above it then rises out of its own mask word by word.

  HONESTY NOTE — READ THIS BEFORE TRUSTING THE WORD "LOADER"
  The Loopstack template has NO loader. No overlay, no counter, no percentage, no progress
  event, no gate of any kind. Its whole intro is two independent CSS cascades that both start
  on DOMContentLoaded and run CONCURRENTLY:
      · the wordmark letter sweep  (1.2s, 0.09s step, finishes at 1.92s over 9 glyphs)
      · the headline word reveal   (1.3s, 0.10s step)
  Everything in this file is ported verbatim from that source EXCEPT the sequencing. The gate —
  "wordmark completes → content reveals" — is the one thing that was added, because a swappable
  loader Section needs a completion event and the wordmark's final glyph is the only completion
  event the choreography actually has. Flip the controls panel to "concurrent" to get the
  source's real, ungated behaviour back; the numbers are identical either way.

  PORTED VERBATIM (do not re-time — these numbers are the asset)
    letter sweep : translateX(-105%) + blur(20px) → 0, 1.2s cubic-bezier(0.05, 0.9, 0.1, 1),
                   0.09s per glyph, opacity 0 → 1 by 25%, resting opacity 0.95
    word reveal  : translateY(105%)  + blur(20px) → 0, 1.3s cubic-bezier(0.05, 0.9, 0.1, 1),
                   0.10s per word,  opacity 0 → 1 by 30%
    live dot     : pulse-glow 2s infinite ease-in-out + wave-expand 2s infinite ease-in-out
    UI easing    : cubic-bezier(0.16, 1, 0.3, 1) — the template's second curve, used for hover
                   and fade transitions only, never for reveals
    geometry     : wordmark 21.9vw / letter-spacing -0.03em / line-height 0.8 / 20px from the
                   bottom edge / translateX(-20px); content pressed to 6vh from the top

  SUBSTITUTIONS (both deliberate, both lightweight)
    1. The template's background film (a 7.8 MB .mp4) is stood in for by a CSS gradient plate
       with the same geometry — bottom-anchored, 90vh tall, full width. It is a placeholder for
       a Background asset, not part of this Section's skin.
    2. The top scrim is a 1600x981 blurred SVG export in the template; here it is an equivalent
       CSS gradient bled up past the top edge.

  NOT PORTED
    The template's custom cursor pair (a ring pinned 1:1 to the pointer plus a glass label pill
    trailing at LERP 0.08) belongs to the hero's interaction layer, not to the intro, so it is
    out of scope here.

  RE-SKIN through the --gl-* tokens only. Note that within THIS section the wordmark is the
  display element, so it takes --gl-font-display; the placeholder content block takes
  --gl-font-body.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f%5B%5D=general-sans@400,500,600&display=swap" rel="stylesheet">
<style>
:root {
  /* ground + ink */
  --gl-bg: #000000;
  --gl-ink: #ffffff;
  --gl-line: rgba(255, 255, 255, 0.18);

  /* the single signal colour — a heartbeat, never a surface */
  --gl-accent: #39ff14;
  --gl-glow: rgba(57, 255, 20, 0.45);

  /* type — in this section the WORDMARK is the display element */
  --gl-font-display: 'General Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --gl-font-body: 'Outfit', ui-sans-serif, system-ui, sans-serif;
  --gl-tracking-display: -0.03em;
  --gl-weight-display: 400;

  /* motion — gl-ease IS the reveal curve. The template's second (hover) curve has no
     token in the canonical vocabulary, so it is held locally as --ui-ease. */
  --gl-ease: cubic-bezier(0.05, 0.9, 0.1, 1);
  --gl-duration-slow: 1.3s;   /* word reveal   */
  --gl-duration: 0.3s;        /* hover / state */
  --ui-ease: cubic-bezier(0.16, 1, 0.3, 1);

  /* choreography constants — the asset. Change these and it is a different loader.
     The two stagger STEPS (0.09s glyph, 0.10s word) are applied per element by the
     splitters, so they live in the script as SWEEP_STEP / WORD_STEP. */
  --sweep-duration: 1.2s;     /* one glyph's travel */
  --mask-blur: 20px;          /* both cascades start blurred by this */
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }

/* One fixed, non-scrolling frame. Every layer is pinned and stacked purely by z-index. */
body {
  background: var(--gl-bg);
  min-height: 100vh;
  overflow: hidden;
  position: relative;
}

/* ---- BACKGROUND PLATE — stand-in for the Background asset (a full-bleed film).
       Same geometry as the template: bottom-anchored, full width, 90vh tall. ---- */
#plate {
  position: fixed;
  bottom: 0; left: 0;
  width: 100vw; height: 90vh;
  z-index: -1;
  overflow: hidden;
  background:
    radial-gradient(58% 46% at 52% 30%, #2b2622 0%, #14120f 46%, #000 78%),
    radial-gradient(42% 38% at 22% 74%, #1b1d21 0%, transparent 70%),
    radial-gradient(38% 34% at 82% 66%, #221a1d 0%, transparent 72%),
    #000;
}

/* ---- TOP SCRIM — bled up past the frame so it has already faded out by ~a third down.
       Stands in for the template's blurred SVG export. ---- */
#scrim {
  position: fixed;
  top: -30vh; left: 0;
  width: 100vw; height: 90vh;
  z-index: 0;
  pointer-events: none;
  background: linear-gradient(to bottom, #000 0%, #000 62%, rgba(0,0,0,0.72) 78%, rgba(0,0,0,0) 100%);
}

/* ---- CONTENT BLOCK — pressed to the top edge, centred, revealed by the gate ---- */
.content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding-top: 6vh;
  width: 95%;
  max-width: 1100px;
  margin: 0 auto;
}

.headline {
  font-family: var(--gl-font-body);
  font-size: 2.8rem;
  font-weight: 400;
  color: var(--gl-ink);
  line-height: 1.15;
  margin: 0 0 2.2rem;
  letter-spacing: -0.015em;
  text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
}

/* word mask — the wrapper clips, the inner travels */
.headline .word-wrapper {
  display: inline-block;
  overflow: hidden;
  vertical-align: bottom;
  padding-bottom: 0.15em;   /* room for descenders so y/p/g are not clipped */
  margin-bottom: -0.15em;
}
.headline .word-inner {
  display: inline-block;
  opacity: 0;
  transform: translateY(105%);
  filter: blur(var(--mask-blur));
}
/* THE GATE: nothing in the content block moves until body carries -ready. */
body.-ready .headline .word-inner {
  animation: word-reveal-mask var(--gl-duration-slow) var(--gl-ease) forwards;
}
@keyframes word-reveal-mask {
  0%   { opacity: 0; transform: translateY(105%); filter: blur(var(--mask-blur)); }
  30%  { opacity: 1; }
  100% { opacity: 1; transform: translateY(0);    filter: blur(0); }
}

/* CTA pill — verbatim from the template. NOTE: in the source the button has NO entrance
   animation at all; the fade below is the demo's own handoff cue, on the UI curve. */
.cta {
  font-family: var(--gl-font-body);
  font-size: 1.1rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--gl-ink);
  background-color: var(--gl-bg);
  border: 1px solid var(--gl-line);
  padding: 1.3rem 2.5rem;
  border-radius: 9999px;
  display: inline-flex;
  align-items: center;
  gap: 0.9rem;
  cursor: pointer;
  box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
  outline: none;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.4s var(--ui-ease), transform 0.4s var(--ui-ease),
              background-color var(--gl-duration) var(--ui-ease),
              color var(--gl-duration) var(--ui-ease),
              border-color var(--gl-duration) var(--ui-ease);
}
body.-ready .cta {
  opacity: 1;
  transform: translateY(0);
  /* 0.6s = the last word of a nine-word headline has just started its own reveal */
  transition-delay: 0.6s, 0.6s, 0s, 0s, 0s;
}
.cta:hover {
  background-color: var(--gl-ink);
  color: var(--gl-bg);
  border-color: var(--gl-ink);
}

/* live dot — verbatim */
.dot {
  width: 10px; height: 10px;
  background-color: var(--gl-accent);
  border-radius: 50%;
  position: relative;
  display: inline-block;
  animation: pulse-glow 2s infinite ease-in-out;
}
.dot::after {
  content: '';
  position: absolute;
  top: -5px; left: -5px; right: -5px; bottom: -5px;
  background-color: var(--gl-glow);
  border-radius: 50%;
  animation: wave-expand 2s infinite ease-in-out;
}
@keyframes pulse-glow {
  0%, 100% { opacity: 0.5; transform: scale(0.85); box-shadow: 0 0 4px rgba(57, 255, 20, 0.3); }
  50%      { opacity: 1;   transform: scale(1.1);  box-shadow: 0 0 12px rgba(57, 255, 20, 0.9); }
}
@keyframes wave-expand {
  0%   { transform: scale(0.6); opacity: 0.9; }
  100% { transform: scale(2.3); opacity: 0; }
}

/* ---- THE LOADER ITSELF — bottom-edge wordmark, letter by letter from the left ---- */
.wordmark-wrap {
  position: fixed;
  bottom: 20px; left: 0; right: 0;
  width: 100%;
  padding: 0 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 3;
}
.wordmark {
  font-family: var(--gl-font-display);
  font-size: 21.9vw;            /* fitted to a NINE-glyph name; refit if you change it */
  font-weight: var(--gl-weight-display);
  color: var(--gl-ink);
  letter-spacing: var(--gl-tracking-display);
  margin: 0 -0.03em 0 0;        /* claw back the trailing letter-space */
  transform: translateX(-20px);
  line-height: 0.8;
  text-align: center;
  width: 100%;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0.95;
}
.wordmark .letter-wrapper {
  display: inline-block;
  overflow: hidden;             /* the mask */
  vertical-align: bottom;
  line-height: 0.8;
}
.wordmark .letter-inner {
  display: inline-block;
  opacity: 0;
  transform: translateX(-105%);
  filter: blur(var(--mask-blur));
  animation: letter-reveal-mask var(--sweep-duration) var(--gl-ease) forwards;
}
@keyframes letter-reveal-mask {
  0%   { opacity: 0;    transform: translateX(-105%); filter: blur(var(--mask-blur)); }
  25%  { opacity: 1; }
  100% { opacity: 0.95; transform: translateX(0);     filter: blur(0); }
}

/* ---- ADDED (not in the source): reduced motion lands everything at rest immediately,
        and the gate fires on the next frame so content is never withheld. ---- */
@media (prefers-reduced-motion: reduce) {
  .wordmark .letter-inner,
  body.-ready .headline .word-inner { animation: none !important; }
  .wordmark .letter-inner { opacity: 0.95; transform: none; filter: none; }
  .headline .word-inner   { opacity: 1;    transform: none; filter: none; }
  .cta { transition: none !important; }
}

/* ============ CONTROLS — strip this block and the panel JS to ship the section ============ */
#ui {
  position: fixed; top: 12px; right: 12px; z-index: 10; width: 208px;
  background: rgba(8, 8, 10, 0.82); border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 8px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  color: #dbe6f2; font: 11px/1.4 -apple-system, system-ui, sans-serif; user-select: none;
  padding: 10px;
}
#ui b { display: block; font-weight: 600; letter-spacing: .04em; margin-bottom: 8px; }
#ui .row { display: flex; gap: 6px; margin-bottom: 8px; }
#ui button {
  flex: 1; padding: 6px; cursor: pointer; color: #dbe6f2; background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.16); border-radius: 5px; font: 11px/1 inherit;
}
#ui button:hover { background: rgba(255,255,255,.13); }
#ui button.-on { border-color: rgba(120,255,140,.55); color: #c9ffbe; }
#ui .read { font: 10px/1.5 ui-monospace, Menlo, monospace; color: rgba(219,230,242,.6); }
#ui .read i { font-style: normal; color: #c9ffbe; }
/* ============ END CONTROLS ============ */
</style>
<!-- ODORO-BADGE:START -->
<style>
  /* Badge de marque ODORO. Bloc autonome, retirable d'un bloc sans rien casser. */
  .odoro-badge {
    position: fixed;
    top: var(--odoro-top, clamp(14px, 2.2vw, 26px));
    left: clamp(14px, 2.2vw, 26px);
    z-index: 2147483000;
    display: flex; align-items: center; gap: .24em;
    color: #F57423;
    font: 600 clamp(15px, 1.45vw, 19px)/1 Poppins, "Nunito Sans", "Avenir Next",
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    letter-spacing: -.012em;
    /* Ne jamais intercepter le pointeur : plusieurs Sections se pilotent au drag. */
    pointer-events: none;
    user-select: none; -webkit-user-select: none;
  }
  .odoro-badge svg { width: 1.45em; height: 1.45em; display: block; flex: none; }
  .odoro-badge span { padding-bottom: .05em; }
  @media (prefers-reduced-motion: reduce) { .odoro-badge { transition: none; } }
</style>
<!-- ODORO-BADGE:END -->
</head>
<body>

<div id="plate"></div>
<div id="scrim"></div>

<!-- the gated content block -->
<main class="content">
  <h1 class="headline">This content was gated <br> until the last glyph landed</h1>
  <button class="cta">
    <span>Book a demo</span>
    <span class="dot"></span>
  </button>
</main>

<!-- the loader -->
<div class="wordmark-wrap">
  <h2 class="wordmark">Loopstack</h2>
</div>

<!-- CONTROLS -->
<div id="ui">
  <b>Loopstack Loader</b>
  <div class="row">
    <button id="ui-replay">↺ replay</button>
  </div>
  <div class="row">
    <button id="ui-gated" class="-on">gated</button>
    <button id="ui-concurrent">concurrent</button>
  </div>
  <div class="read">gate at <i id="ui-t">—</i></div>
</div>
<!-- END CONTROLS -->

<script>
/* ============================================================
   THE CHOREOGRAPHY. Three moves, hand-rolled, zero libraries —
   exactly as the template does it.

     1. split the wordmark into glyphs, each in its own mask,
        each delayed by index * 0.09s
     2. split the content headline into words (preserving the hard
        <br>), each in its own mask, each delayed by index * 0.1s
     3. gate: the last glyph's animationend adds body.-ready, which
        is what lets (2) run at all
============================================================ */

const SWEEP_STEP = 0.09   // s, glyph to glyph   — verbatim
const WORD_STEP  = 0.10   // s, word to word     — verbatim

const wordmark = document.querySelector('.wordmark')
const headline = document.querySelector('.headline')
const WORDMARK_TEXT = wordmark.textContent.trim()
const HEADLINE_HTML = headline.innerHTML

let t0 = 0

/* ---- 2. word splitter — splits on whitespace, keeps the hard <br> ---- */
function splitWords() {
  const parts = HEADLINE_HTML.split(/(\s+|<br\s*\/?>)/i)
  headline.innerHTML = ''
  let i = 0
  for (const part of parts) {
    if (part.trim() === '') {
      headline.appendChild(document.createTextNode(' '))
    } else if (part.toLowerCase().startsWith('<br')) {
      headline.appendChild(document.createElement('br'))
    } else {
      const wrapper = document.createElement('span')       // the mask
      wrapper.className = 'word-wrapper'
      const inner = document.createElement('span')         // the traveller
      inner.className = 'word-inner'
      inner.textContent = part
      inner.style.animationDelay = `${i * WORD_STEP}s`
      i++
      wrapper.appendChild(inner)
      headline.appendChild(wrapper)
    }
  }
}

/* ---- 1. glyph splitter + 3. the gate ---- */
function splitLetters(onComplete) {
  const chars = [...WORDMARK_TEXT]
  wordmark.innerHTML = ''
  let last = null
  chars.forEach((char, index) => {
    const wrapper = document.createElement('span')         // the mask
    wrapper.className = 'letter-wrapper'
    const inner = document.createElement('span')           // the traveller
    inner.className = 'letter-inner'
    inner.textContent = char === ' ' ? ' ' : char   // spaces still occupy a mask
    // 9 glyphs x 0.09s = 0.72s for the last delay; + 1.2s of travel = 1.92s to rest.
    inner.style.animationDelay = `${index * SWEEP_STEP}s`
    wrapper.appendChild(inner)
    wordmark.appendChild(wrapper)
    last = inner
  })
  // The ONLY completion event this choreography has: the final glyph coming to rest.
  if (last) last.addEventListener('animationend', onComplete, { once: true })
  else onComplete()
}

/* ---- run ---- */
const readout = document.getElementById('ui-t')
function liftGate() {
  document.body.classList.add('-ready')
  if (readout) readout.textContent = `${Math.round(performance.now() - t0)} ms`
}

let mode = 'gated'   // 'gated' | 'concurrent' (concurrent === the template's real behaviour)

function play() {
  document.body.classList.remove('-ready')
  if (readout) readout.textContent = '—'
  splitWords()
  // force a reflow so a replay restarts both cascades from frame zero
  void document.body.offsetWidth
  t0 = performance.now()
  splitLetters(mode === 'gated' ? liftGate : () => {
    if (readout) readout.textContent = 'ungated'
  })
  if (mode === 'concurrent') requestAnimationFrame(() => document.body.classList.add('-ready'))
  // reduced motion: nothing will ever fire animationend, so lift on the next frame
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(liftGate)
}

/* CONTROLS — strip with the #ui markup */
const btnGated = document.getElementById('ui-gated')
const btnConcurrent = document.getElementById('ui-concurrent')
document.getElementById('ui-replay').addEventListener('click', play)
btnGated.addEventListener('click', () => {
  mode = 'gated'; btnGated.classList.add('-on'); btnConcurrent.classList.remove('-on'); play()
})
btnConcurrent.addEventListener('click', () => {
  mode = 'concurrent'; btnConcurrent.classList.add('-on'); btnGated.classList.remove('-on'); play()
})
/* END CONTROLS */

play()
</script>
<!-- ODORO-BADGE:START -->
<div class="odoro-badge" role="img" aria-label="Odoro">
  <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
    <path d="M10 10 H50 A40 40 0 1 1 10 50 Z"
          fill="none" stroke="currentColor" stroke-width="14" stroke-linejoin="miter"/>
  </svg>
  <span>odoro</span>
</div>
<!-- ODORO-BADGE:END -->
</body>
</html>
