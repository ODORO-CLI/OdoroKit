<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Section · Slipstream</title>
<!--
  GetLayers · Section — Slipstream
  An immersive INFINITE 3D carousel on a near-black stage. Portrait image-cards stand on one
  tilted belt (CSS 3D, no WebGL) that recedes diagonally into the dark — the right cards loom
  large and near, the left cards shrink and dissolve into black — and the belt wraps forever, so
  it reads as one continuous river of cards. Drag / swipe / arrow-keys to fly through it; it also
  idles with a slow drift. Each card is real HTML: the serif title + meta stay perfectly crisp.
  Card images load from assets/slipstream/*.webp. Type: Fraunces (serif) + Inter (UI), Google
  Fonts. Every parameter is exposed in the on-screen controls (top-right; strip for the catalog).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0a0a0c; overflow: hidden; }
  #section { position: fixed; inset: 0; color: #fff;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    /* live style vars, driven by the controls panel */
    --bg: #0a0a0c;
    --corner: 14px; --lift: 1.035; --shadow: 1; --vig: 1;
    --title-size: 20px; --meta-size: 11.5px; --title-color: #ffffff; --scrim: 1;
  }

  /* ---------- stage + belt ---------- */
  #stage { position: fixed; inset: 0; overflow: hidden; z-index: 1;
    background:
      radial-gradient(130% 100% at 72% 62%, #16161c 0%, var(--bg) 62%, #050506 100%);
    perspective: 1500px; perspective-origin: 50% 64%;
    cursor: grab; touch-action: none; user-select: none; outline: none; }
  #stage.-drag { cursor: grabbing; }

  #belt { position: absolute; inset: 0; transform-style: preserve-3d;
    transform: rotateY(var(--tilt, -32deg)); }

  .card { position: absolute; left: 50%; top: var(--cy, 64%);
    width: var(--cw, 230px); height: var(--ch, 308px);
    margin-left: calc(var(--cw, 230px) / -2); margin-top: calc(var(--ch, 308px) / -2);
    transform-style: preserve-3d; will-change: transform, opacity; }

  .card__inner { position: absolute; inset: 0; border-radius: var(--corner); overflow: hidden;
    background: #131318;
    box-shadow: 0 40px 80px -24px rgba(0,0,0, calc(.72 * var(--shadow))),
                0 8px 24px -10px rgba(0,0,0, calc(.6 * var(--shadow)));
    transition: transform .34s cubic-bezier(.22,.61,.36,1), box-shadow .34s ease;
    will-change: transform; }
  /* .-active is set by JS on the one card under the pointer (never via CSS :hover — see script) */
  .card.-active .card__inner { transform: scale(var(--lift));
    box-shadow: 0 52px 100px -24px rgba(0,0,0,.8), 0 10px 30px -10px rgba(0,0,0,.7); }
  .card__inner img { position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block; }

  .card__scrim { position: absolute; inset: 0; pointer-events: none; opacity: var(--scrim);
    background: linear-gradient(to top,
      rgba(4,4,6,.92) 0%, rgba(4,4,6,.55) 24%, rgba(4,4,6,.08) 46%, rgba(4,4,6,0) 62%); }

  .card__foot { position: absolute; left: 16px; right: 14px; bottom: 15px; z-index: 2; }
  .card__title { margin: 0; font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
    font-weight: 400; font-size: var(--title-size); line-height: 1.12; letter-spacing: -.005em;
    color: var(--title-color); text-shadow: 0 2px 14px rgba(0,0,0,.55); }
  .card__meta { margin: 7px 0 0; font-size: var(--meta-size); font-weight: 500;
    letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.6); }

  /* far-edge dark fall-off + floor vignette (purely cosmetic; opacity fade does the real hiding) */
  #vignette { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: var(--vig);
    background:
      linear-gradient(to right, #050506 0%, rgba(5,5,6,.55) 12%, rgba(5,5,6,0) 34%),
      linear-gradient(to bottom, rgba(5,5,6,0) 62%, rgba(5,5,6,.5) 100%); }

  /* ---------- header chrome ---------- */
  #top { position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    padding: 26px clamp(20px, 4vw, 56px); }
  #brand { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 16px;
    letter-spacing: .02em; }
  #brand .rule { width: 34px; height: 1px; background: rgba(255,255,255,.5); display: inline-block; }
  #nav { display: flex; gap: clamp(16px, 2.4vw, 34px); }
  #nav a { color: rgba(255,255,255,.82); text-decoration: none; font-size: 14px; font-weight: 500;
    letter-spacing: .01em; transition: color .2s; }
  #nav a:hover, #nav a:focus-visible { color: #fff; }

  #lede { position: fixed; top: clamp(96px, 15vh, 150px); left: 0; right: 0; z-index: 4;
    margin: 0; padding: 0 clamp(22px, 6vw, 48px); text-align: center; pointer-events: none;
    font-family: 'Fraunces', Georgia, serif; font-weight: 340; letter-spacing: -.015em;
    font-size: clamp(27px, 4.4vw, 62px); line-height: 1.1; color: #fff; text-wrap: balance; }

  .hint { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 5;
    font-size: 11px; letter-spacing: .3em; text-transform: uppercase; font-weight: 500;
    color: rgba(255,255,255,.34); pointer-events: none; user-select: none; }

  a:focus-visible, #stage:focus-visible { outline: 2px solid rgba(255,255,255,.7); outline-offset: 3px; }

  @media (max-width: 720px) {
    #nav { display: none; }
    #top { padding: 18px 20px; }
    #brand { font-size: 14px; }
    #brand .rule { width: 22px; }
    #lede { top: clamp(78px, 12vh, 116px); }
    #lede br { display: none; }   /* let the heading wrap naturally instead of the desktop break */
    .hint { bottom: 18px; letter-spacing: .24em; }
  }
  @media (max-height: 540px) {
    #lede { top: 58px; font-size: clamp(22px, 5.6vw, 38px); }
  }
  @media (prefers-reduced-motion: reduce) { .card__inner { transition: none; } }

  /* ============ CONTROLS — remove this block (+ the panel JS) to ship without the dev panel ============ */
  #ui { position: fixed; top: 12px; right: 12px; z-index: 10; width: 236px; max-height: 92vh; overflow: auto;
    background: rgba(10,10,14,.86); border: 1px solid rgba(255,255,255,.12); border-radius: 8px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    color: #e7e7ef; font: 11px/1.35 'Inter', system-ui, sans-serif; user-select: none; }
  #ui-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; cursor: pointer; }
  #ui-head b { font-weight: 600; letter-spacing: .04em; }
  #ui-head span { color: rgba(231,231,239,.5); font-size: 14px; }
  #ui-body { padding: 2px 10px 10px; display: block; }
  #ui.-collapsed #ui-body { display: none; }
  .ui-grp { margin: 8px 0 2px; color: rgba(200,180,255,.72); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; }
  .ui-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 5px 0; }
  .ui-row label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: rgba(231,231,239,.82); }
  .ui-row input[type=range] { width: 104px; }
  .ui-row input[type=color] { width: 26px; height: 18px; padding: 0; border: 1px solid rgba(255,255,255,.2); border-radius: 3px; background: none; cursor: pointer; }
  .ui-row .val { width: 42px; text-align: right; font: 10px/1 ui-monospace, Menlo, monospace; color: rgba(200,180,255,.9); }
  #ui-copy, #ui-reset { width: 100%; padding: 6px; cursor: pointer; color: #e7e7ef;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16); border-radius: 5px; font: 11px/1 inherit; }
  #ui-copy { margin-top: 10px; border-color: rgba(170,140,255,.4); color: #e6d9ff; }
  #ui-reset { margin-top: 6px; }
  #ui-copy:hover, #ui-reset:hover { background: rgba(255,255,255,.13); }
  /* ============ END CONTROLS ============ */
</style>
<!-- ODORO-BADGE:START -->
<style>
  /* Badge de marque ODORO. Bloc autonome, retirable d'un bloc sans rien casser. */
  .odoro-badge {
    position: fixed;
    top: var(--odoro-top, clamp(14px, 2.2vw, 26px));
    left: clamp(14px, 2.2vw, 26px);
    z-index: 2147483000;
    display: flex; align-items: center; gap: .24em;
    color: #F57423;
    font: 600 clamp(15px, 1.45vw, 19px)/1 Poppins, "Nunito Sans", "Avenir Next",
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    letter-spacing: -.012em;
    /* Ne jamais intercepter le pointeur : plusieurs Sections se pilotent au drag. */
    pointer-events: none;
    user-select: none; -webkit-user-select: none;
  }
  .odoro-badge svg { width: 1.45em; height: 1.45em; display: block; flex: none; }
  .odoro-badge span { padding-bottom: .05em; }
  @media (prefers-reduced-motion: reduce) { .odoro-badge { transition: none; } }
</style>
<!-- ODORO-BADGE:END -->
</head>
<body>
<div id="section">
  <div id="stage" tabindex="0" role="region" aria-label="Slipstream — draggable 3D card carousel. Use left and right arrow keys to move.">
    <div id="belt"></div>
  </div>
  <div id="vignette"></div>

  <header id="top">
    <div id="brand"><span>Slipstream</span><span class="rule"></span></div>
    <nav id="nav"></nav>
  </header>
  <h1 id="lede"></h1>
  <div class="hint">Drag to explore</div>
</div>

<!-- CONTROLS -->
<div id="ui">
  <div id="ui-head"><b>Slipstream</b><span id="ui-caret">▾</span></div>
  <div id="ui-body"></div>
</div>
<!-- END CONTROLS -->

<script type="module">
/* ============================================================
   CARDS — the content. Edit titles / meta / images here.
============================================================ */
const CARDS = [
  { img: 'assets/slipstream/tidepool.webp', title: 'Fluid worlds beneath the surface', meta: 'Places · 6 min' },
  { img: 'assets/slipstream/molten.webp',   title: 'Marbled gold, caught mid-pour',    meta: 'Textures · 4 min' },
  { img: 'assets/slipstream/neon.webp',     title: 'Painting with light in the dark',  meta: 'Studio · 5 min' },
  { img: 'assets/slipstream/prism.webp',    title: 'Colour fields and soft collisions',meta: 'Abstract · 3 min' },
  { img: 'assets/slipstream/fauve.webp',    title: 'Bold strokes, louder palettes',    meta: 'Painting · 7 min' },
  { img: 'assets/slipstream/kinetic.webp',  title: 'Kinetic lines that never rest',    meta: 'Motion · 5 min' },
]

/* ============================================================
   CONFIG (P) — every tunable value, exposed in the controls panel.
============================================================ */
const P = {
  // stage
  bg: '#0a0a0c',
  vignette: 1.4,
  // belt
  slots: 9,
  cardScale: 1,
  cardRatio: 1.34,
  tilt: -32,
  spacing: 0.3,
  perspective: 1,
  cardY: 0.64,
  corner: 14,
  cardShadow: 1,
  // motion
  autoScroll: 0.22,
  drag: 0.9,
  damp: 0.92,
  hoverLift: 1.035,
  // fade
  fadeFar: 0.24,
  nearHide: 0.4,
  // overlay
  scrim: 1.4,
  titleSize: 20,
  metaSize: 11.5,
  titleColor: '#ffffff',
}

/* content strings for the header chrome (edit freely) */
const HEADER = {
  nav: ['Places', 'Authors', 'Journal', 'About', 'Connect'],
  lede: 'Selected and popular stories<br>from the studio right now',
}

const DEFAULTS = JSON.parse(JSON.stringify(P))
const STORAGE_KEY = 'getlayers:slipstream'
try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); if (s) for (const k in s) if (k in P) P[k] = s[k] } catch (e) {}
const saveP = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(P)) } catch (e) {} }

const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches
const section = document.getElementById('section')
const stage = document.getElementById('stage')
const belt = document.getElementById('belt')

/* ---------- header chrome ---------- */
document.getElementById('nav').innerHTML = HEADER.nav.map(n => `<a href="#" tabindex="0">${n}</a>`).join('')
document.getElementById('lede').innerHTML = HEADER.lede

/* ---------- build the belt (cycle images to fill `slots`) ---------- */
let cardEls = []
function buildBelt() {
  belt.innerHTML = ''; cardEls = []; hoverEl = null   // drop any stale reference to a removed card
  for (let i = 0; i < P.slots; i++) {
    const cd = CARDS[i % CARDS.length]
    const card = document.createElement('article')
    card.className = 'card'
    card.innerHTML = `
      <div class="card__inner">
        <img src="${cd.img}" alt="${cd.title}" draggable="false" loading="lazy">
        <div class="card__scrim"></div>
        <div class="card__foot">
          <h3 class="card__title">${cd.title}</h3>
          <p class="card__meta">${cd.meta}</p>
        </div>
      </div>`
    belt.appendChild(card)
    cardEls.push(card)
  }
}

/* ---------- geometry (responsive); STEP/SPAN drive the wrap math ---------- */
let CW = 230, CH = 308, STEP = 220, SPAN = 1980
function layout() {
  const vw = innerWidth
  CW = Math.min(250, Math.max(168, vw * 0.16)) * P.cardScale
  CH = CW * P.cardRatio
  STEP = CW * (1 + P.spacing)
  SPAN = STEP * P.slots
  stage.style.setProperty('--cw', CW + 'px')
  stage.style.setProperty('--ch', CH + 'px')
  stage.style.setProperty('--cy', (P.cardY * 100) + '%')
  stage.style.setProperty('--tilt', P.tilt + 'deg')
  stage.style.perspective = Math.max(800, vw * 0.9 * P.perspective) + 'px'
  stage.style.perspectiveOrigin = '50% ' + (P.cardY * 100) + '%'
}

/* ---------- live style vars ---------- */
function applyStyles() {
  const s = section.style
  s.setProperty('--bg', P.bg)
  s.setProperty('--vig', P.vignette)
  s.setProperty('--corner', P.corner + 'px'); s.setProperty('--shadow', P.cardShadow)
  s.setProperty('--lift', P.hoverLift); s.setProperty('--scrim', P.scrim)
  s.setProperty('--title-size', P.titleSize + 'px'); s.setProperty('--meta-size', P.metaSize + 'px')
  s.setProperty('--title-color', P.titleColor)
}

const smoothstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t) }
/* opacity by belt fraction f ∈ [-0.5, 0.5): fade in from the far/left, fade out just before the near seam */
function vis(f) {
  const far = smoothstep(-0.5, -0.5 + P.fadeFar, f)
  const near = 1 - smoothstep(P.nearHide, 0.5, f)
  return Math.min(far, near)
}

/* ---------- place every card for the current scroll position ---------- */
function place() {
  const half = SPAN / 2
  for (let i = 0; i < cardEls.length; i++) {
    let x = ((i * STEP + pos) % SPAN + SPAN) % SPAN      // [0, SPAN)
    if (x > half) x -= SPAN                              // [-half, half)
    const op = vis(x / SPAN)
    const el = cardEls[i]
    el.style.transform = 'translateX(' + x.toFixed(1) + 'px)'
    el.style.opacity = op.toFixed(3)
    el.style.visibility = op < 0.008 ? 'hidden' : 'visible'
  }
}

window.addEventListener('resize', () => { layout(); place() })

/* ---------- hover state, driven by pointer MOVEMENT (not CSS :hover) ----------
   CSS :hover is re-evaluated by the browser every frame; on this overlapping 3D belt it
   flip-flops between cards even with the cursor still, pulsing the scale transition — the
   "shake". Instead we pick the hovered card only when the pointer actually moves (via
   elementFromPoint, one deterministic result per call). A still cursor fires no events, so the
   state simply can't change. Touch is excluded (no hover; a sticky state would freeze the belt). */
const CAN_HOVER = matchMedia('(hover: hover) and (pointer: fine)').matches
let hoverEl = null
function setHover(card) {
  if (card === hoverEl) return
  if (hoverEl) hoverEl.classList.remove('-active')
  hoverEl = card
  if (hoverEl) hoverEl.classList.add('-active')
}
function hoverAt(x, y) {
  const el = document.elementFromPoint(x, y)
  setHover(el ? el.closest('.card') : null)
}

/* ---------- interaction: drag to fly (inertia) + idle drift + keyboard ---------- */
let pos = 0, vel = 0, dragging = false, lastX = 0
stage.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; vel = 0; setHover(null); stage.classList.add('-drag'); stage.setPointerCapture(e.pointerId) })
stage.addEventListener('pointermove', (e) => {
  if (dragging) {
    const dx = e.clientX - lastX; lastX = e.clientX
    const d = dx * P.drag; pos += d; vel = d
  } else if (CAN_HOVER) {
    hoverAt(e.clientX, e.clientY)
  }
})
const end = () => { dragging = false; stage.classList.remove('-drag') }   // leave hover off so a fling glides; it re-arms on the next move
stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end)
stage.addEventListener('pointerleave', () => setHover(null))
stage.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') { vel += STEP * 0.14; e.preventDefault() }
  else if (e.key === 'ArrowLeft') { vel -= STEP * 0.14; e.preventDefault() }
})

let lastPlaced = NaN
function tick() {
  if (!dragging) {
    // hover-to-pause: the belt holds still while a card is active, so it can't slide under a
    // resting cursor. momentum still decays, so nothing jumps when the pointer leaves.
    if (!hoverEl) { pos += vel; if (!REDUCE) pos -= P.autoScroll }
    vel *= P.damp
  }
  if (pos !== lastPlaced) { place(); lastPlaced = pos }   // only touch the DOM when the belt moved
  requestAnimationFrame(tick)
}

/* ============================================================
   CONTROLS PANEL — schema-driven; live-updates styles/layout;
   `slots` rebuilds the belt. (Strip this block for the catalog build.)
============================================================ */
const SCHEMA = [
  ['Stage'],
  ['bg', 'Background', 'color'], ['vignette', 'Vignette', 0, 1.4, 0.02],
  ['Belt'],
  ['slots', 'Cards', 5, 20, 1, 'rebuild'], ['cardScale', 'Card size', 0.5, 1.8, 0.02], ['cardRatio', 'Card ratio', 1.0, 2.0, 0.02],
  ['tilt', 'Belt tilt', -70, -8, 1], ['spacing', 'Spacing', 0.1, 1.4, 0.02], ['perspective', 'Perspective', 0.4, 2, 0.02],
  ['cardY', 'Belt height', 0.4, 0.85, 0.01], ['corner', 'Corner', 0, 40, 1], ['cardShadow', 'Shadow', 0, 2, 0.02],
  ['Motion'],
  ['autoScroll', 'Auto-drift', 0, 1.5, 0.02], ['drag', 'Drag speed', 0.3, 2, 0.05], ['damp', 'Inertia', 0.8, 0.99, 0.005], ['hoverLift', 'Hover lift', 1, 1.15, 0.005],
  ['Fade'],
  ['fadeFar', 'Far dissolve', 0.05, 0.45, 0.01], ['nearHide', 'Near cutoff', 0.28, 0.49, 0.01],
  ['Overlay'],
  ['scrim', 'Scrim', 0, 1.4, 0.02], ['titleSize', 'Title size', 12, 34, 1], ['metaSize', 'Meta size', 8, 18, 0.5], ['titleColor', 'Title colour', 'color'],
]
const REBUILD = new Set(['slots'])
const valEls = {}, inpEls = {}
const fmt = (v) => Number.isInteger(v) ? String(v) : String(parseFloat(v.toFixed(4)))
function onChange(key, v) { P[key] = v; saveP(); if (REBUILD.has(key)) buildBelt(); layout(); applyStyles(); place() }

;(() => {
  const body = document.getElementById('ui-body')
  for (const row of SCHEMA) {
    if (row.length === 1) { const h = document.createElement('div'); h.className = 'ui-grp'; h.textContent = row[0]; body.appendChild(h); continue }
    const [key, label, a, b, step] = row
    const el = document.createElement('div'); el.className = 'ui-row'
    const lab = document.createElement('label'); lab.textContent = label; el.appendChild(lab)
    if (a === 'color') {
      const inp = document.createElement('input'); inp.type = 'color'; inp.value = P[key]; inpEls[key] = inp
      inp.addEventListener('input', () => onChange(key, inp.value)); el.appendChild(inp)
    } else {
      const inp = document.createElement('input'); inp.type = 'range'; inp.min = a; inp.max = b; inp.step = step; inp.value = P[key]; inpEls[key] = inp
      const val = document.createElement('span'); val.className = 'val'; val.textContent = fmt(P[key]); valEls[key] = val
      inp.addEventListener('input', () => { onChange(key, parseFloat(inp.value)); val.textContent = fmt(P[key]) })
      el.appendChild(inp); el.appendChild(val)
    }
    body.appendChild(el)
  }
  const copy = document.createElement('button'); copy.id = 'ui-copy'; copy.textContent = '⧉ copy config'
  copy.addEventListener('click', () => copyConfig(copy)); body.appendChild(copy)
  const reset = document.createElement('button'); reset.id = 'ui-reset'; reset.textContent = '↺ reset to defaults'
  reset.addEventListener('click', () => { for (const k in DEFAULTS) P[k] = DEFAULTS[k]; try { localStorage.removeItem(STORAGE_KEY) } catch (e) {}; location.reload() })
  body.appendChild(reset)
  const head = document.getElementById('ui-head'), panel = document.getElementById('ui'), caret = document.getElementById('ui-caret')
  head.addEventListener('click', () => { panel.classList.toggle('-collapsed'); caret.textContent = panel.classList.contains('-collapsed') ? '▸' : '▾' })
  if (innerWidth < 760) { panel.classList.add('-collapsed'); caret.textContent = '▸' }
})()

const GROUPS = { bg: 'stage', slots: 'belt', autoScroll: 'motion', fadeFar: 'fade', scrim: 'overlay' }
function configText() {
  const lines = ['const P = {']
  for (const k in P) {
    if (GROUPS[k]) lines.push('  // ' + GROUPS[k])
    const v = P[k]
    lines.push(`  ${k}: ${typeof v === 'string' ? `'${v}'` : fmt(v)},`)
  }
  lines.push('}')
  return lines.join('\n')
}
async function copyConfig(btn) {
  const text = configText()
  try { await navigator.clipboard.writeText(text) }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy') } catch (e2) {} document.body.removeChild(ta) }
  const old = btn.textContent; btn.textContent = '✓ copied'; setTimeout(() => { btn.textContent = old }, 1200)
}

/* ---------- go ---------- */
buildBelt(); layout(); applyStyles(); place(); tick()
</script>
<!-- ODORO-BADGE:START -->
<div class="odoro-badge" role="img" aria-label="Odoro">
  <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
    <path d="M10 10 H50 A40 40 0 1 1 10 50 Z"
